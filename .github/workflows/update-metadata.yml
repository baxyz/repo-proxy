name: Update Repository Metadata

on:
  schedule:
    # Daily at 4 AM UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_descriptors:
        description: "Force descriptor recalculation"
        type: boolean
        default: false
      force_apt:
        description: "Force APT metadata regeneration"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/update-metadata.yml"
      - "src/github/**"

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  CACHE_PREFIX: "update-metadata"
  PROTON_CACHE_DIR: /tmp/proton-api-cache
  PROTON_CACHE_KEY: proton-files-${{ github.run_id }}
  APT_OUTPUT_DIR: /tmp/apt-metadata
  APT_CACHE_KEY: apt-metadata-${{ github.run_id }}

jobs:
  # ============================================================================
  # Security: Verify repository (prevents workflow from running on forks)
  # ============================================================================

  verify-repository:
    runs-on: ubuntu-latest
    name: Verify repository
    if: github.repository == 'baxyz/repo-proxy'
    steps:
      - name: Repository check
        run: |
          echo "✅ Running in authorized repository: ${{ github.repository }}"
          echo "🔐 Repository verified, proceeding with workflow..."

  # ============================================================================
  # Phase 1: Download and check latest sources
  # ============================================================================

  proton-sources:
    runs-on: ubuntu-latest
    name: Check Proton sources
    needs: [verify-repository]
    matrix:
      proton-product: [mail, pass, auth]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Proton API responses
        run: pnpm ci:source:proton
        env:
          proton_product: ${{ matrix.proton-product }}

  # ============================================================================
  # Phase 2: Enrich descriptors using KV cache
  # ============================================================================

  proton-enrichments:
    runs-on: ubuntu-latest
    name: Enrich Proton descriptors
    needs: [proton-sources]
    matrix:
      proton-product: [mail, pass, auth]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Proton API responses
        run: pnpm ci:enrich:proton
        env:
          proton_product: ${{ matrix.proton-product }}

  # ============================================================================
  # Phase 3: Update repository metadata
  # ============================================================================

  repo-apt:
    runs-on: ubuntu-latest
    name: Update APT repository
    needs: [proton-enrichments]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Proton API responses
        run: pnpm ci:repo:apt
